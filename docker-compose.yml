services:
  db:
    image: pgvector/pgvector:pg16
    container_name: local-rag-db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql
    restart: unless-stopped

volumes:
  pgdata:
